# Pre-commit hooks для alisa_chess.
# Установка: pip install pre-commit && pre-commit install
# Прогон вручную: pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=500']

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic>=2.0.0
        # Постепенная типизация: запускаем только на «опорных» модулях,
        # чтобы CI не падал на legacy-коде. Расширяем список по мере миграции.
        files: ^(game_state|skill_state|tts_builder)\.py$

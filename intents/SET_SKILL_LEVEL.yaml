# Интент: изменение уровня сложности
root:
    %lemma
    $ChangeLevel $LevelLemma
    $LevelLemma $ChangeLevel
    $ChangeLevel $Level $LevelLemma
    $ChangeLevel $LevelLemma (на)? $Level
    $ChangeLevel (на)? $Level $LevelLemma
    $LevelLemma (на)? $Level


slots:
    level:
        type: YANDEX.NUMBER
        source: $Level

$ChangeLevel:
    %lemma
    измени | поставь | выбери | задай | сделай | установи | поменяй | set | change

$LevelLemma:
    %lemma
    уровень | уровень сложности | сложность | level | skill level

$Level:
    $YANDEX.NUMBER

filler:
    пожалуйста | ну | на | эй | давай | сложности

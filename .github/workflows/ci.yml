name: CI

on:
  pull_request:
    branches: [master, main]
  workflow_call:
    inputs:
      target:
        required: true
        type: string

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements-app.txt ruff==0.17.6 pytest mypy
      - run: ruff check .
      - run: ruff format --check .
      - name: Mypy (advisory)
        run: mypy game_state.py skill_state.py tts_builder.py
        continue-on-error: true
      - run: python -m pytest tests/

  package:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        target: ${{ fromJSON(inputs.target && format('["{0}"]', inputs.target) || '["testing","api-testing","production"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - name: Build and smoke-test the function ZIP
        env:
          TARGET: ${{ matrix.target }}
        run: bash .github/scripts/build-function.sh "$TARGET"
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: function-${{ matrix.target }}-${{ github.sha }}
          path: |
            dist/function.zip
            dist/function.sha256
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 7

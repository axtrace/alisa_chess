name: Deploy testing functions

on:
  push:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      target:
        description: Тестовая функция
        type: choice
        options: [testing, api-testing]
        default: testing
        required: true

permissions:
  contents: read

jobs:
  release:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: ./.github/workflows/release-function.yml
    with:
      target: ${{ inputs.target || 'testing' }}
    secrets:
      yc_key: ${{ secrets.YC_SA_JSON_CREDENTIALS_2 }}
      folder: ${{ secrets.FOLDER_ID_2 }}
      bucket: ${{ secrets.BUCKET_NAME_2 }}

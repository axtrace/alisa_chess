name: Deploy production skill

on: workflow_dispatch

permissions:
  contents: read

jobs:
  release:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: ./.github/workflows/release-function.yml
    with:
      target: production
    secrets:
      yc_key: ${{ secrets.YC_SA_JSON_CREDENTIALS_2 }}
      folder: ${{ secrets.FOLDER_ID_2 }}
      bucket: ${{ secrets.BUCKET_NAME_2 }}
